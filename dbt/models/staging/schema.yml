version: 2

models:
  - name: stg_ppr_transactions
    description: Typed PPR transaction records built from raw PostgreSQL text loads.
    columns:
      - name: ppr_id
        tests:
          - not_null
          - unique
      - name: sale_date
        tests:
          - not_null
      - name: sale_year_month
        tests:
          - not_null
      - name: county
        tests:
          - not_null
      - name: price_eur
        tests:
          - not_null

  - name: stg_rppi_series
    description: Typed Residential Property Price Index series records.
    columns:
      - name: rppi_id
        tests:
          - not_null
          - unique
      - name: month_start
        tests:
          - not_null
      - name: year_month
        tests:
          - not_null
      - name: property_series
        tests:
          - not_null

  - name: stg_planning_applications
    description: Typed planning application records with source epoch timestamps converted to dates.
    columns:
      - name: planning_id
        tests:
          - not_null
          - unique
