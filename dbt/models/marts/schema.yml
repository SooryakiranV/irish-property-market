version: 2

models:
  - name: monthly_market
    description: Monthly PPR market metrics joined to national RPPI.
    columns:
      - name: year_month
        tests:
          - not_null
          - unique
      - name: month_start
        tests:
          - not_null
      - name: transactions
        tests:
          - not_null
      - name: total_value
        tests:
          - not_null

  - name: county_market
    description: Annual county-level PPR market metrics.
    columns:
      - name: county
        tests:
          - not_null
      - name: sale_year
        tests:
          - not_null
      - name: transactions
        tests:
          - not_null

  - name: planning_activity
    description: Monthly planning activity by planning authority.
    columns:
      - name: planning_authority
        tests:
          - not_null
      - name: year_month
        tests:
          - not_null
      - name: month_start
        tests:
          - not_null
      - name: applications
        tests:
          - not_null

  - name: property_market_summary
    description: Portfolio summary metrics from the transformed market datasets.
    columns:
      - name: metric_name
        tests:
          - not_null
          - unique
